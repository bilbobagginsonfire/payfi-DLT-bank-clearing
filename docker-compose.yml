# PayFi Platform — Local Development Environment
# Corda 5 uses multi-tenant schemas within a single database.
#
# NOTE: This is illustrative. Corda 5 deployment requires:
# - HOCON configuration files (not env vars)
# - MGM bootstrap and virtual node creation
# - TLS certificate setup
# - Worker role configuration
# A developer with Corda 5 ops experience must configure the actual deployment.
#
# Usage:
#   docker-compose up -d
#   docker-compose logs -f
#   docker-compose down -v

version: '3.8'

services:

  # Single PostgreSQL instance — Corda 5 multi-tenant schemas
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: corda
      POSTGRES_USER: corda
      POSTGRES_PASSWORD: corda_password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corda"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Corda 5 Combined Worker
  # Hosts all virtual nodes: BankAlpha, BankBeta, BankGamma, SARBObserver, Notary
  # Image: verify actual tag at corda-os-docker.software.r3.com
  #
  # Virtual nodes and their MGM metadata:
  #   BankAlpha:     O=BankAlpha, L=Johannesburg, C=ZA  branchCode=100001 role=PARTICIPANT
  #   BankBeta:      O=BankBeta, L=Cape Town, C=ZA      branchCode=200002 role=PARTICIPANT
  #   BankGamma:     O=BankGamma, L=Durban, C=ZA        branchCode=300003 role=PARTICIPANT
  #   SARBObserver:  O=SARBObserver, L=Pretoria, C=ZA   role=REGULATOR_OBSERVER
  #   Notary:        O=Notary, L=Johannesburg, C=ZA     role=NOTARY
  #
  # After container starts, use Corda 5 REST API to:
  # 1. Bootstrap MGM
  # 2. Create virtual nodes
  # 3. Upload CPK/CPB bundles
  # 4. Set member-provided context (branchCode, role, participantStatus)
  corda:
    image: corda-os-docker.software.r3.com/corda-os-combined-worker:5.2.2.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8888:8888"   # REST API
      - "7004:7004"   # P2P Gateway
    # NOTE: Actual Corda 5 configuration uses HOCON files mounted as volumes.
    # The environment variables below are ILLUSTRATIVE ONLY.
    # Replace with proper Corda 5 configuration before use.
    environment:
      CORDA_DEV_MODE: "true"

volumes:
  db-data:
